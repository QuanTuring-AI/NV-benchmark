# Vol.5 · second -f file after the Blueprint's vectordb.yaml, default profile (Elasticsearch and SeaweedFS): only the
# container names and the volume names differ, so that nothing of an earlier run is in them. Image, heap, licence and
# every other setting are the Blueprint's.
services:
  elasticsearch:
    container_name: p137_elasticsearch
  seaweedfs:
    container_name: p137_seaweedfs
volumes:
  rag-vol-elasticsearch:
    name: p137-vol-elasticsearch
  rag-vol-seaweedfs:
    name: p137-vol-seaweedfs
